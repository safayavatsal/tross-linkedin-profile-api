services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: ../../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
